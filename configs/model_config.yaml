# ==============================================================================
# Model Architecture & Training Hyperparameters
# ==============================================================================

artifacts_dir: "models/artifacts"

random_forest:
  n_estimators: 150
  max_depth: 12
  min_samples_split: 4
  min_samples_leaf: 2
  class_weight: "balanced"
  random_state: 42
  n_jobs: -1

xgboost:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  early_stopping_rounds: 15
  eval_metric: "logloss"

cnn_1d:
  input_channels: 1
  sequence_length: 2048
  conv_layers:
    - out_channels: 32
      kernel_size: 15
      stride: 2
      padding: 7
    - out_channels: 64
      kernel_size: 7
      stride: 2
      padding: 3
    - out_channels: 128
      kernel_size: 5
      stride: 2
      padding: 2
  dropout: 0.3
  learning_rate: 0.001
  weight_decay: 1e-4
  batch_size: 32
  max_epochs: 30
  early_stopping_patience: 6
  device: "auto"  # "auto", "cpu", "cuda", or "mps"

anomaly_detection:
  algorithm: "IsolationForest"
  contamination: 0.05
  n_estimators: 100
  random_state: 42
