[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "AI-Powered Mechanical Condition Monitoring & Gearbox Failure Prevention Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Predictive Maintenance Engineering Team" }
]
dependencies = [
    "numpy>=1.24.0,<2.2.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "torch>=2.1.0",
    "joblib>=1.3.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "pyserial>=3.5",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0"
]

[tool.setuptools.packages.find]
where = ["src"]
